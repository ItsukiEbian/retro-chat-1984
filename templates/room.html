<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Video Desk — 自習室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    <script>
        window.ROLE = {{ role | tojson }};
        window.USER_NAME = {{ user_name | tojson }};
        window.ROOM_ID = {{ room_id | tojson }};
        window.USER_DB_ID = {{ current_user.id | tojson }};
        window.TOTAL_STUDY_TIME_MINUTES = {{ total_study_time_minutes | default (0) | tojson }};
    </script>
</head>

<body data-room-context="main">
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <!-- 目標設定モーダル（入室直後に表示） -->
    <div id="goalOverlay" class="overlay goal-overlay">
        <div class="overlay-card goal-card">
            <div class="overlay-card-header">
                <span class="overlay-icon goal-icon">🎯</span>
                <h1>今回の勉強目標を教えてください</h1>
                <p>今日の目標を書くと、AIコーチが応援してくれます</p>
            </div>
            <div class="goal-form">
                <textarea id="goalInput" class="goal-textarea" rows="3"
                    placeholder="例: 数学の問題集の10ページ〜12ページを解く&#10;例: 英単語を50個覚える"></textarea>
                <div id="goalFeedback" class="goal-feedback" hidden aria-live="polite"></div>
                <div class="overlay-card-actions">
                    <button id="goalSubmitBtn" class="btn-primary goal-submit-btn">目標を設定して入室する</button>
                </div>
            </div>
        </div>
    </div>

    <div class="main-with-panel">
        <main class="main">
            <header class="main-header main-header-compact">
                <div class="main-header-left"></div>
                <div class="main-header-actions"></div>
            </header>

            <div class="main-content" id="mainRoomContent">
                {% if role == 'admin' %}
                <div class="card card-students" id="studentsCard">
                    <div class="card-header">
                        <h3>学習者一覧</h3>
                    </div>
                    <div class="card-body">
                        <ul class="student-list" id="studentList"></ul>
                    </div>
                </div>
                {% endif %}
                <div class="card card-video card-video-main">
                    <div class="card-header card-header-mini">
                        <div id="status" class="status-text">待機中...</div>
                    </div>
                    <div class="card-body card-body-video">
                        <div class="videos-container" id="videosContainer"></div>
                    </div>
                </div>

                <!-- メインルーム: 学習者は挙手のみ。チャット・写真・マイク/カメラは個別ルームでのみ表示 -->
                <footer class="control-bar main-room-control-bar" id="mainRoomControlBar">
                    {% if role == 'student' %}
                    <button type="button" id="handRaiseBtn" class="control-btn control-btn-hand" aria-pressed="false"
                        title="挙手する">
                        <span class="control-btn-filigree-icon">
                            <span class="material-symbols-outlined">pan_tool</span>
                            <span class="control-btn-gem"></span>
                        </span>
                        <span class="control-btn-label">挙手する</span>
                    </button>
                    {% endif %}
                    <a href="{{ url_for('room_exit') }}" id="leaveRoomBtn" class="control-btn control-btn-exit"
                        title="退室してロビーへ">
                        <span class="control-btn-filigree-icon">
                            <span class="material-symbols-outlined">logout</span>
                        </span>
                        <span class="control-btn-label">退室</span>
                    </a>
                </footer>
            </div>

            <!-- 個別指導ルーム時のみ表示: チャット・写真・マイク/カメラ -->
            <div id="privateRoomContent" class="private-room-content" hidden>
                <div class="private-room-body">
                    <div class="private-media-start-banner" id="privateMediaStartBanner">
                        <p class="private-media-start-desc">通話を開始するには、下のボタンをクリックしてカメラ・マイクへのアクセスを許可してください。</p>
                        <button type="button" class="btn-primary" id="privateMediaStartBtn">カメラ・マイクを開始</button>
                    </div>
                    <div class="private-video-section" id="privateVideoSection">
                        <div class="private-videos" id="privateVideosContainer"></div>
                    </div>
                    <!-- Integrated luxury control bar -->
                    <div class="prv-control-bar">
                        <button type="button" class="prv-ctrl-btn prv-ctrl-round" id="privateMicBtn" title="マイク"
                            aria-label="マイク">
                            <span class="material-symbols-outlined">mic</span>
                        </button>
                        <button type="button" class="prv-ctrl-btn prv-ctrl-round" id="privateCameraBtn" title="カメラ"
                            aria-label="カメラ">
                            <span class="material-symbols-outlined">videocam</span>
                        </button>
                        <button type="button" class="prv-ctrl-btn prv-ctrl-round" id="privateChatToggleBtn" title="チャット"
                            aria-label="チャット">
                            <span class="material-symbols-outlined">chat</span>
                        </button>
                        <div class="prv-volume-wrap">
                            <span class="material-symbols-outlined prv-volume-icon">volume_up</span>
                            <input type="range" id="privateRemoteVolumeSlider" class="prv-volume-slider" min="0"
                                max="100" value="100" title="相手の音量">
                        </div>
                        <button type="button" class="prv-ctrl-btn prv-ctrl-end" id="endPrivateSessionBtn">
                            <span class="material-symbols-outlined">call_end</span>
                            <span class="prv-ctrl-end-label">指導を終了して戻る</span>
                        </button>
                    </div>
                    <!-- Chat drawer -->
                    <div class="prv-chat-drawer" id="privateChatDrawer">
                        <div class="prv-chat-drawer-header">
                            <span class="prv-chat-drawer-title">チャット</span>
                            <button type="button" class="prv-chat-drawer-close" id="privateChatCloseBtn"
                                aria-label="チャットを閉じる">
                                <span class="material-symbols-outlined">close</span>
                            </button>
                        </div>
                        <div class="prv-chat-messages" id="privateChatMessages"></div>
                        <div class="prv-chat-input-area">
                            <label class="prv-chat-photo-btn">
                                <span class="material-symbols-outlined">photo_camera</span>
                                <input type="file" id="privatePhotoInput" accept="image/*" capture="environment" hidden>
                            </label>
                            <input type="text" id="privateChatInput" class="prv-chat-input" placeholder="メッセージを入力"
                                maxlength="500">
                            <button type="button" class="prv-chat-send-btn" id="privateChatSendBtn">送信</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/room.js') }}"></script>
</body>

</html>
