<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Video Desk — ニックネームの変更</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-auth">
    <div class="auth-center">
        <div class="auth-card settings-card">
            <div class="auth-card-header">
                <h1>ニックネームの変更</h1>
                <p>自習室や学習記録で表示されるお名前を設定します。</p>
            </div>
            {% if error %}
            <p class="auth-error">{{ error }}</p>
            {% endif %}
            <form method="post" action="{{ url_for('settings') }}" class="auth-form settings-form">
                <label class="auth-label" for="display_name">ニックネーム</label>
                <input type="text" id="display_name" name="display_name" class="auth-input" value="{{ current_display_name }}" placeholder="ニックネームを入力" maxlength="64">
                <div class="settings-actions">
                    <a href="{{ url_for('dashboard') }}" class="settings-cancel-link">キャンセルして戻る</a>
                    <button type="submit" class="btn-primary settings-save-btn">保存する</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
